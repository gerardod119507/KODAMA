<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KODAMA — Cobros</title>
  <link rel="stylesheet" href="css/styles.css" />
  <meta name="theme-color" content="#F5F1E8" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Íconos chicos: versión simplificada del símbolo (las curvas finas desaparecen). -->
  <link rel="icon" href="icons/icono.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="KODAMA" />
  <script src="js/tema.js"></script>
</head>
<body>
  <!-- Sello de agua: el símbolo de Academia Fractal, grande y muy tenue, detrás de todo. -->
  <div class="sello" aria-hidden="true"></div>
  <!-- Pantalla de carga: atractor de Lorenz dibujándose (js/ui/carga.js). Se va sola
       apenas hay algo que mostrar. -->
  <div id="carga" class="carga" role="status" aria-label="Cargando">
    <canvas class="carga__lienzo"></canvas>
  </div>
  <script src="js/lorenz.js"></script>
  <script src="js/ui/carga.js"></script>
  <header class="cabecera">
    <h1><span class="marca" aria-hidden="true"></span>Cobros</h1>
    <nav class="enlaces-cabecera">
      <a href="index.html">Día</a>
      <a href="alumnos.html">Alumnos</a>
      <a href="estadisticas.html">Estadísticas</a>
      <a href="config.html">Configuración</a>
      <button type="button" class="boton-tema fantasma">☾ Oscuro</button>
    </nav>
  </header>

  <main class="pagina-datos">
    <div class="filtros">
      <div>
        <label for="filtro-mes">Mes</label>
        <input id="filtro-mes" type="month" />
      </div>
    </div>

    <p id="estado-cobros" class="estado" role="status"></p>

    <section id="zona-cobros" hidden>
      <h2>Pago mensual</h2>
      <p class="nota">Alumnos que pagan por mes: lo acumulado (horas dictadas × su tarifa) y si ya pagaron.</p>
      <div id="lista-mensual" class="lista-tarjetas"></div>

      <h2>Pagos del mes</h2>
      <div id="lista-pagos" class="lista-tarjetas"></div>
      <button id="nuevo-pago" type="button" class="secundario">+ Registrar pago</button>
    </section>
  </main>

  <dialog id="dialogo-pago">
    <form id="form-pago">
      <h2 id="titulo-dialogo-pago">Registrar pago</h2>

      <label for="pago-alumno">Alumno</label>
      <select id="pago-alumno"></select>

      <div class="fila-horas">
        <div>
          <label for="pago-desde">Desde</label>
          <input id="pago-desde" type="date" />
        </div>
        <div>
          <label for="pago-hasta">Hasta</label>
          <input id="pago-hasta" type="date" />
        </div>
      </div>

      <label for="pago-monto">Monto (Bs)</label>
      <div class="fila-con-boton">
        <input id="pago-monto" type="text" inputmode="decimal" autocomplete="off" />
        <button type="button" id="calcular-monto" class="secundario">Calcular</button>
      </div>
      <p id="detalle-monto" class="nota"></p>

      <div class="fila-horas">
        <div>
          <label for="pago-estado">Estado</label>
          <select id="pago-estado">
            <option value="pendiente">Pendiente</option>
            <option value="pagado">Pagado</option>
          </select>
        </div>
        <div>
          <label for="pago-fecha">Fecha de pago</label>
          <input id="pago-fecha" type="date" />
        </div>
      </div>

      <label for="pago-notas">Notas</label>
      <textarea id="pago-notas" rows="2" autocapitalize="sentences"></textarea>

      <p id="error-pago" class="error" role="alert"></p>

      <div class="acciones-dialogo">
        <button type="button" id="cancelar-pago" class="secundario">Cancelar</button>
        <button type="button" id="archivar-pago" class="fantasma" hidden>Archivar</button>
        <button type="submit" id="guardar-pago">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/fecha.js"></script>
  <script src="js/api.js"></script>
  <script src="js/alumnos.js"></script>
  <script src="js/estadisticas.js"></script>
  <script src="js/cobros.js"></script>
  <script src="js/cobros-pagina.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
