<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KODAMA — Conexión</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <h1>Conexión</h1>
    <p class="nota">Estos datos se guardan solo en este dispositivo. Nunca se suben al repositorio.</p>

    <form id="formulario">
      <label for="url">URL del Web App</label>
      <input id="url" type="url" required autocomplete="off" inputmode="url"
             placeholder="https://script.google.com/macros/s/.../exec" />

      <label for="token">Token</label>
      <input id="token" type="password" required autocomplete="off" />

      <button type="submit">Probar y guardar</button>
    </form>

    <button id="probar-malo" type="button" class="secundario">Probar con token incorrecto</button>

    <p id="resultado" role="status"></p>
    <ul id="areas"></ul>

    <p><a href="index.html">Volver</a></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
</body>
</html>
