name: Deploy Apps Script

# Corre solo si un push a main tocó apps-script/ o este mismo archivo (así
# un cambio al workflow, como una versión de clasp, dispara un run real en
# vez de depender de "Re-run failed jobs" — ese botón vuelve a correr el
# workflow tal como estaba en el commit que originó el run, no el de main
# actual, así que nunca prueba un fix hecho después). "Run workflow" en la
# pestaña Actions lo dispara a mano cuando ninguno de los dos cambió.
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # @3: misma mayor que el "clasp login" local de Gerardo (clasp
      # cambió el formato de ~/.clasprc.json entre mayores — v2 usa
      # {"token":...}, v3 usa {"tokens":...} — por eso importa la mayor,
      # no el parche exacto). Riesgo aceptado: un parche 3.x nuevo podría
      # en teoría volver a cambiar el formato; el paso de abajo imprime la
      # versión instalada en cada run para que se note enseguida si pasa.
      - name: Instalar clasp
        run: npm install -g @google/clasp@3

      - name: Verificar versión instalada
        run: clasp --version

      # .clasprc.json (credenciales) y .clasp.json (scriptId) se arman acá,
      # a partir de los secrets del repo. Nunca quedan en el código fuente.
      - name: Configurar credenciales
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          # tr -d: un secret copiado a mano suele traer un espacio o un salto
          # de línea invisible al final, y clasp lo rechaza.
          id_script="$(printf '%s' "$SCRIPT_ID" | tr -d '[:space:]')"
          if [ -z "$id_script" ]; then
            echo "::error::El secret SCRIPT_ID está vacío."
            exit 1
          fi
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$id_script" > .clasp.json

      - name: Publicar código (clasp push)
        run: clasp push --force

      # -i apunta al despliegue que ya existe (creado a mano en el
      # Checkpoint 2): crea una versión nueva del código y la asocia a ese
      # mismo despliegue, así la URL del Web App nunca cambia.
      #
      # OJO: clasp puede imprimir un error y AUN ASÍ salir con código 0. Pasó
      # el 2026-09-23: "Invalid deployment ID" con el job en verde, así que
      # el código quedó subido pero el Web App siguió sirviendo la versión
      # anterior durante todo un checkpoint. Por eso acá se revisa la salida
      # además del código de salida.
      - name: Actualizar el despliegue existente
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set -uo pipefail
          id_despliegue="$(printf '%s' "$DEPLOYMENT_ID" | tr -d '[:space:]')"
          if [ -z "$id_despliegue" ]; then
            echo "::error::El secret DEPLOYMENT_ID está vacío."
            exit 1
          fi

          salida="$(clasp deploy -i "$id_despliegue" -d "Auto-deploy ${{ github.sha }}" 2>&1)"
          codigo=$?

          # El deployment ID es la parte /macros/s/<ID>/exec de la URL del
          # Web App, así que nunca se imprime crudo: se reemplaza antes de
          # mostrar nada (el repo es público y los logs también).
          salida_segura="$(printf '%s' "$salida" | sed "s|$id_despliegue|<DEPLOYMENT_ID>|g")"
          echo "$salida_segura"

          if [ $codigo -ne 0 ] || printf '%s' "$salida" | grep -qiE 'invalid|error|not found|failed'; then
            echo "::error::clasp deploy no actualizó el despliegue. Revisá el secret DEPLOYMENT_ID (Implementar → Administrar implementaciones → ID de implementación)."
            exit 1
          fi

          echo "Despliegue actualizado."
