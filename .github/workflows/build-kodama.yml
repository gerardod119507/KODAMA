name: Build KODAMA Android APK

# La APK solo hace falta de nuevo cuando cambia la parte nativa (íconos,
# permisos, configuración de Capacitor): los cambios de la app llegan solos
# por el actualizador (bundle.zip, publicado por pages.yml). Para armarla a
# mano: pestaña Actions → este workflow → "Run workflow".
on:
  push:
    branches:
      - main
    paths:
      - 'capacitor.config.json'
      - 'resources/**'
      - 'scripts/**'
      - '.github/workflows/build-kodama.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar carpeta www
        run: |
          scripts/armar-web.sh www

      - name: Instalar dependencias de Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/local-notifications@^6.0.0 @capgo/capacitor-updater@^6.0.0

      - name: Agregar y sincronizar plataforma Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Parchear Android (minSdk 24, compileSdk 35 y permisos)
        run: |
          node scripts/patch-android.js

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: KODAMA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
