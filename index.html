<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KODAMA</title>
  <link rel="stylesheet" href="css/styles.css" />
  <meta name="theme-color" content="#F5F1E8" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Íconos chicos: versión simplificada del símbolo (las curvas finas desaparecen). -->
  <link rel="icon" href="icons/icono.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="KODAMA" />
  <script src="js/tema.js"></script>
</head>
<body data-pagina="inicio">
  <!-- Sello de agua: el símbolo de Academia Fractal, grande y muy tenue, detrás de todo. -->
  <div class="sello" aria-hidden="true"></div>
  <!-- Pantalla de arranque (js/ui/carga.js): solo al abrir la app. El atractor se
       asienta en el logo; se va apenas hay algo que mostrar. -->
  <div id="carga" class="carga" role="status" aria-label="Cargando">
    <canvas class="carga__lienzo"></canvas>
  </div>
  <script src="js/lorenz.js"></script>
  <script src="js/ui/carga.js"></script>
  <!-- Arriba solo el logo, la fecha y el tema. La navegación la arma
       js/ui/navegacion.js: barra abajo en el celular, arriba en pantallas anchas. -->
  <header class="cabecera">
    <a class="logo" href="index.html"><span class="marca" aria-hidden="true"></span>KODAMA</a>
    <p class="cabecera__fecha">
      <span id="fecha" class="fecha" aria-live="polite"></span>
      <span id="actualizando" class="actualizando" role="status" hidden>actualizando</span>
    </p>
    <button type="button" class="boton-tema fantasma">☾ Oscuro</button>
  </header>
  <script src="js/ui/navegacion.js"></script>

  <main>
    <h1 class="solo-lectores">KODAMA</h1>
    <!-- Día y Semana se eligen en la navegación (abajo o arriba). -->
    <div class="barra-navegacion">
      <div class="navegacion">
        <button id="anterior" type="button" class="boton-barra" aria-label="Anterior">‹</button>
        <button id="ir-hoy" type="button" class="boton-barra">Hoy</button>
        <button id="siguiente" type="button" class="boton-barra" aria-label="Siguiente">›</button>
      </div>
      <label class="capas">
        <span class="capas__etiqueta">Capa</span>
        <select id="capa"></select>
      </label>
    </div>
    <div id="barra-rango" class="barra-rango" hidden>
      <span class="capas__etiqueta">Días</span>
      <label class="capas">
        <span class="capas__etiqueta">del</span>
        <select id="rango-desde" aria-label="Primer día visible"></select>
      </label>
      <label class="capas">
        <span class="capas__etiqueta">al</span>
        <select id="rango-hasta" aria-label="Último día visible"></select>
      </label>
    </div>
    <p id="aviso-offline" class="aviso-offline" hidden>Mostrando lo último guardado. Sin conexión.</p>
    <div id="vista-dia"></div>
  </main>

  <div class="acciones-flotantes">
    <button id="nuevo-bloque" type="button" class="fab" aria-label="Nuevo bloque">+</button>
  </div>

  <dialog id="dialogo-bloque">
    <form id="form-bloque">
      <h2 id="titulo-dialogo">Nuevo bloque</h2>
      <p id="subtitulo-dialogo" class="nota" hidden></p>

      <!-- Solo en un bloque nuevo, si hay plantillas guardadas. -->
      <div id="plantillas-nuevo" class="plantillas oculto-al-mover" hidden>
        <p class="plantillas__titulo">Desde una plantilla</p>
        <div id="lista-plantillas" class="plantillas__lista"></div>
      </div>

      <!-- .oculto-al-mover se oculta en "Mover" y "Duplicar" (quedan fecha y hora; al duplicar, solo la fecha). -->
      <div class="oculto-al-mover">
        <label for="campo-area">Área</label>
        <select id="campo-area"></select>
      </div>

      <!-- Solo en Academia Fractal (lo arma js/ui/selector-alumnos.js). -->
      <div id="campo-alumnos" class="oculto-al-mover" hidden></div>

      <div class="oculto-al-mover">
        <label for="campo-titulo" id="etiqueta-titulo">Título</label>
        <input id="campo-titulo" type="text" autocapitalize="sentences"
               autocomplete="off" enterkeyhint="done" />

        <label for="campo-tipo">Tipo</label>
        <select id="campo-tipo"></select>
      </div>

      <div>
        <label for="campo-fecha">Fecha</label>
        <div class="fila-fecha">
          <input id="campo-fecha" type="date" />
          <button type="button" id="fecha-hoy" class="secundario">Hoy</button>
          <button type="button" id="fecha-manana" class="secundario">Mañana</button>
        </div>
      </div>

      <div class="fila-horas oculto-al-duplicar">
        <div>
          <label for="campo-inicio">Inicio</label>
          <input id="campo-inicio" type="time" />
        </div>
        <div>
          <label for="campo-fin">Fin</label>
          <input id="campo-fin" type="time" />
        </div>
      </div>

      <p id="aviso-horas" class="aviso oculto-al-duplicar" role="status"></p>

      <div class="oculto-al-mover">
        <label for="campo-lugar">Lugar</label>
        <input id="campo-lugar" type="text" autocomplete="off" autocapitalize="sentences"
               placeholder="Aula E511, casa del alumno…" />
      </div>

      <div class="oculto-al-mover">
        <label for="campo-etiqueta">Etiqueta</label>
        <input id="campo-etiqueta" type="text" list="sugerencias-etiqueta" autocomplete="off" />
        <datalist id="sugerencias-etiqueta">
          <option value="Nerak"></option>
          <option value="Data cocha"></option>
          <option value="otro"></option>
        </datalist>

        <label for="campo-notas">Notas</label>
        <textarea id="campo-notas" rows="3" autocapitalize="sentences"></textarea>
      </div>

      <p id="error-bloque" class="error" role="alert"></p>

      <div class="acciones-dialogo">
        <button type="button" id="cancelar-bloque" class="secundario">Cancelar</button>
        <button type="button" id="archivar-bloque" class="fantasma" hidden>Archivar</button>
        <button type="submit" id="guardar-bloque">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialogo-ficha" class="ficha" aria-labelledby="ficha-titulo">
    <button type="button" id="ficha-cerrar" class="fantasma ficha__cerrar" aria-label="Cerrar">✕</button>
    <p class="ficha__tipo">
      <span id="ficha-icono" class="bloque__icono"></span>
      <span id="ficha-tipo-area"></span>
    </p>
    <h2 id="ficha-titulo"></h2>
    <p id="ficha-horario" class="ficha__horario"></p>
    <p id="ficha-estado" class="ficha__estado"></p>
    <p id="ficha-movida" class="ficha__movida" hidden></p>
    <dl class="ficha__datos">
      <div id="ficha-fila-lugar">
        <dt>Lugar</dt>
        <dd></dd>
      </div>
      <div id="ficha-fila-etiqueta">
        <dt>Etiqueta</dt>
        <dd></dd>
      </div>
      <div id="ficha-fila-notas">
        <dt>Notas</dt>
        <dd class="ficha__notas"></dd>
      </div>
    </dl>
    <p id="error-ficha" class="error" role="alert"></p>
    <p id="ficha-aviso" class="aviso" role="status"></p>
    <div class="acciones-estado">
      <button type="button" id="ficha-dictada">✓ Marcar dictada</button>
      <button type="button" id="ficha-cancelar" class="secundario">Cancelar clase</button>
      <button type="button" id="ficha-reactivar" class="secundario" hidden></button>
    </div>
    <div id="ficha-plantilla" class="ficha__cancelacion" hidden>
      <label for="ficha-nombre-plantilla">Nombre de la plantilla</label>
      <input type="text" id="ficha-nombre-plantilla" maxlength="60" autocomplete="off" autocapitalize="sentences" />
      <div class="acciones-dialogo">
        <button type="button" id="ficha-plantilla-volver" class="secundario">Volver</button>
        <button type="button" id="ficha-plantilla-guardar">Guardar plantilla</button>
      </div>
    </div>
    <div id="ficha-cancelacion" class="ficha__cancelacion" hidden>
      <label for="ficha-motivo">Motivo (opcional)</label>
      <input type="text" id="ficha-motivo" maxlength="200" autocomplete="off" autocapitalize="sentences" />
      <div class="acciones-dialogo">
        <button type="button" id="ficha-cancelar-volver" class="secundario">Volver</button>
        <button type="button" id="ficha-cancelar-confirmar">Confirmar cancelación</button>
      </div>
    </div>
    <div class="acciones-ficha">
      <button type="button" id="ficha-editar">Editar</button>
      <button type="button" id="ficha-mover" class="secundario">Mover</button>
      <button type="button" id="ficha-duplicar" class="secundario">Duplicar</button>
      <button type="button" id="ficha-plantilla-abrir" class="secundario">Guardar como plantilla</button>
      <button type="button" id="ficha-archivar" class="fantasma">Archivar</button>
    </div>
  </dialog>

  <script src="js/fecha.js"></script>
  <script src="js/medicion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/capas.js"></script>
  <script src="js/alumnos.js"></script>
  <script src="js/clases.js"></script>
  <script src="js/formas.js"></script>
  <script src="js/plantillas.js"></script>
  <script src="js/vista.js"></script>
  <script src="js/ui/iconos.js"></script>
  <script src="js/ui/espiritu.js"></script>
  <script src="js/ui/dia.js"></script>
  <script src="js/ui/semana.js"></script>
  <script src="js/ui/selector-alumnos.js"></script>
  <script src="js/ui/horas.js"></script>
  <script src="js/ui/formulario.js"></script>
  <script src="js/ui/ficha.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
